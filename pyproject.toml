[project]
name = "mcp-hub"
version = "0.1.0"
description = "MCP bridge that manages project-bound child MCP servers behind a single MCP entry."
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]

[project.scripts]
mcp-hub = "mcp_hub.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_hub"]
